<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" />
    <title>Notes App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-bar nav-menus="Add New Note,Note List,Profile"></app-bar>
    <main class="page-content">
      <note-form></note-form>
      <section class="notes-section" aria-labelledby="notes-heading">
        <div class="section-heading">
          <div>
            <h2 id="notes-heading">Active Notes</h2>
          </div>
          <div class="status-filter">
            <label class="status-filter__label" for="status-dropdown">
              Note signal
            </label>
            <div class="status-filter__control">
              <svg class="status-filter__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3.5v17M3.5 12h17M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4" />
              </svg>
              <select name="status-dropdown" id="status-dropdown">
                <option value="active" selected>Active notes</option>
                <option value="archived">Archived notes</option>
              </select>
              <svg class="status-filter__chevron" viewBox="0 0 16 16" aria-hidden="true">
                <path d="m3 6 5 5 5-5" />
              </svg>
            </div>
          </div>
        </div>
        <div id="notes-list" class="notes-grid" aria-live="polite">
          <p id="empty-note-indicator">No saved notes yet. Let's make one!</p>
        </div>
      </section>
    </main>
    <footer class="site-footer">Notes App &copy;2026</footer>
  </body>
</html>
