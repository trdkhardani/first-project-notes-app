<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" />
    <title>Notes App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-bar nav-menus="Add New Note,Note List,Profile"></app-bar>
    <main class="page-content">
      <note-form></note-form>
      <section class="notes-section" aria-labelledby="notes-heading">
        <div class="section-heading">
          <div>
            <h2 id="notes-heading">Active Notes</h2>
          </div>
          <status-dropdown></status-dropdown>
        </div>
        <div id="notes-list" class="notes-grid" aria-live="polite">
          <p id="empty-note-indicator">No saved notes yet.</p>
        </div>
      </section>
    </main>
    <footer class="site-footer">Notes App &copy;2026</footer>
  </body>
</html>
